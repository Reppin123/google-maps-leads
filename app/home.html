<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16181d;--ink2:#4b5160;--ink3:#7d8494;--line:#e3e6eb;--fill:#eef0f4;--fill2:#e2e6ec;--accent:#2563eb;--accent-ink:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a21;--ink:#eef0f4;--ink2:#b3b9c6;--ink3:#7d8494;--line:#262b35;--fill:#20252e;--fill2:#2a303b;--accent:#60a5fa;--accent-ink:#0b1220;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px}
button:hover{background:var(--fill)}button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}button.primary:hover{filter:brightness(1.08)}
button.quiet{border-color:transparent;background:transparent;color:var(--ink2)}button.quiet:hover{background:var(--fill)}
button.danger{color:var(--bad)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
input[type=checkbox]{width:auto}textarea{resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent);text-decoration:none}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0;font-weight:650}
.tabs{display:flex;gap:2px;background:var(--fill);border-radius:8px;padding:3px}.tabs a{padding:4px 12px;border-radius:6px;color:var(--ink2)}.tabs a.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.meter{margin-left:auto;color:var(--ink2);font-size:12px;display:flex;gap:14px;align-items:center}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-right:5px}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
main{max-width:1180px;margin:0 auto;padding:18px 20px 80px}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel)}
.banner.bad{border-color:var(--bad)}.banner.warn{border-color:var(--warn)}.banner span{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 2px;font-weight:650}.card .sub{color:var(--ink3);margin:0 0 12px;font-size:12px}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:12px;color:var(--ink2);margin:10px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 120px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;background:var(--panel);color:var(--ink2)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}.chip small{opacity:.7;margin-left:4px}
.big{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}.small{font-size:12px}
ul.plain{list-style:none;margin:8px 0;padding:0}ul.plain li{padding:3px 0;display:flex;justify-content:space-between;gap:10px;color:var(--ink2)}
table{width:100%;border-collapse:collapse}th{font-weight:500;color:var(--ink3);font-size:12px;text-align:left}th,td{padding:7px 8px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tr.click{cursor:pointer}tr.click:hover td{background:var(--fill)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;background:var(--fill2);color:var(--ink2)}
.pill.active{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.pill.paused{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.step{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.stephead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.stephead b{font-weight:650}.stephead input{width:58px}
.vtabs{display:flex;gap:4px;margin-left:auto;align-items:center}
.vtab{width:28px;height:26px;padding:0;text-align:center;font-weight:600}.vtab.on{background:var(--ink);color:var(--panel);border-color:transparent}
.preview{background:var(--fill);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:12.5px;min-height:120px;overflow-wrap:anywhere}
.preview .to{color:var(--ink3);font-size:11.5px;display:block}.preview .subj{font-weight:650;display:block;margin:2px 0 8px}
.warnline{color:var(--warn);font-size:12px;margin-top:6px}.badline{color:var(--bad)}
.bar{position:relative;height:8px;background:var(--fill);border-radius:4px;min-width:120px}.bar i{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:4px}.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
.feed .item{padding:10px 0;border-bottom:1px solid var(--line)}.feed .quote{background:var(--fill);border-radius:6px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.topbar input{flex:1 1 240px;font-size:15px;font-weight:600}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:8px;z-index:20;max-width:90vw}
code{font-family:var(--mono);font-size:12px;background:var(--fill);padding:1px 5px;border-radius:4px}
ol.setup{padding-left:18px;color:var(--ink2)}ol.setup li{margin:5px 0}
</style>
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
a.card{display:block;color:inherit;margin:0;transition:border-color .12s}a.card:hover{border-color:var(--accent)}
.card .name{font-size:15px;font-weight:650}.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.nums b{display:block;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.nums span{color:var(--ink3);font-size:12px}
.newcard{border-style:dashed;display:flex;flex-direction:column;justify-content:center}
</style>
</head>
<body>
<header><h1>Projects</h1><div class="meter" id="where"></div></header>
<main>
  <p class="muted" style="margin:0 0 14px">Each project is its own folder and its own data: leads, campaigns, mailbox and do-not-contact never cross from one to another. Only addresses that turned out to be dead are shared.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),4200);}
async function draw(){
  const H=await fetch('/api/home').then(r=>r.json());
  $('#where').textContent='Kept in '+H.root;
  $('#grid').innerHTML=H.projects.map(p=>`<a class="card" href="/p/${esc(p.slug)}/${p.leads?'leads':'#/find'}">
    <div class="name">${esc(p.name)}</div><div class="muted small">${esc(p.country)}${p.mailbox?' · sends from '+esc(p.mailbox):' · no mailbox yet'}</div>
    <div class="nums"><div><b>${p.leads.toLocaleString()}</b><span>businesses</span></div><div><b>${p.inboxes.toLocaleString()}</b><span>inboxes to email</span></div>
      <div><b>${p.campaigns_live}</b><span>campaigns running</span></div><div><b>${p.replies_waiting}</b><span>replies to look at</span></div></div>
    <div class="muted small" style="margin-top:12px">${p.running.length?'<span class="dot ok"></span>'+esc(p.running[0]):p.last_scrape?'Last search '+new Date(p.last_scrape).toLocaleDateString():'Nothing searched yet'}</div></a>`).join('')
   +`<div class="card newcard"><div class="name">New project</div><p class="sub">A new client, country or purpose. It gets its own folder and starts empty.</p>
      <label>Name</label><input id="nname" placeholder="Acme NZ plumbers">
      <label>Country (two letters)</label><input id="ncc" maxlength="2" placeholder="NZ" style="text-transform:uppercase" list="ccs"><datalist id="ccs">${H.countries.map(c=>`<option>${c}`).join('')}</datalist>
      <div style="margin-top:12px"><button class="primary" id="nbtn">Create</button></div></div>`;
  $('#grid').insertAdjacentHTML('beforeend',`<div class="card"><div class="name">Assistant</div><p class="sub">Optional. With an Anthropic API key, the Ask tab in each project can plan searches and draft campaigns from a sentence. The key is kept in your Mac's Keychain and used for every project. Everything else works without it.</p>
     <p><span class="dot ${H.has_ai_key?'ok':''}"></span>${H.has_ai_key?'Key saved':'No key yet'}</p><label>${H.has_ai_key?'Replace the key':'API key'}</label><input id="aikey" type="password" placeholder="sk-ant-..." autocomplete="off">
     <div style="margin-top:12px"><button id="aibtn">Save</button></div></div>`);
  $('#aibtn').onclick=async()=>{const key=$('#aikey').value.trim();if(!key)return toast('Paste a key first.');await fetch('/api/ai-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});toast('Saved');draw();};
  $('#nbtn').onclick=async()=>{const r=await fetch('/api/projects/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#nname').value,country:$('#ncc').value})}).then(r=>r.json());
    if(r.error)return toast(r.error);location.href='/p/'+r.slug+'/#/find';};
}
draw();
</script>
</body>
</html>
